spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/meterrate}
    username: ${DB_USER:meterrate}
    password: ${DB_PASSWORD:meterrate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
