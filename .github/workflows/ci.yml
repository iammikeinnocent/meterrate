name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile · Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven
      - run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/meterrate-*.jar

  test:
    name: Unit + Testcontainers integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven
      - run: mvn -B test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  bruno:
    name: Bruno API smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli
      - name: Build and start stack
        run: |
          mvn -B -DskipTests package -q
          JAR=$(ls target/meterrate-*.jar)
          docker compose up -d postgres
          nohup java -jar "$JAR" --server.port=8080 > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8080/ && break || sleep 2
          done
      - name: Run collection
        run: cd bruno/meterrate && bru run . --env local
